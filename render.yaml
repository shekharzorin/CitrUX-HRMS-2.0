services:
  # ─────────────────────────────────────────────
  # 1. Node.js API Server
  # ─────────────────────────────────────────────
  - type: web
    name: citrux-hrms-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CLIENT_URL
        value: https://citrux-hrms-client.onrender.com,https://portal.citrux.in,https://portal.isnap.in
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false                          # FIX: was missing — needed for OpenAI fallback
      - key: AI_SERVICE_URL
        value: https://citrux-ai-service.onrender.com/ask
      - key: API_URL
        value: https://citrux-hrms-api.onrender.com

  # ─────────────────────────────────────────────
  # 2. React Frontend (Static Site)
  # ─────────────────────────────────────────────
  - type: static
    name: citrux-hrms-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://citrux-hrms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─────────────────────────────────────────────
  # 3. Python AI Microservice (Docker)
  # ─────────────────────────────────────────────
  - type: web
    name: citrux-ai-service
    env: docker
    plan: free
    rootDir: ai-service
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false                          # Primary provider — LLaMA 3.3 open source
      - key: GEMINI_API_KEY
        sync: false                          # Fallback provider
      - key: OPENAI_API_KEY
        sync: false                          # Second fallback
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"      # Only works locally, not on Render
      - key: OLLAMA_MODEL
        value: "llama3"

  # ─────────────────────────────────────────────
  # 4. FastAPI HRMS Chatbot (NLP + Rules)
  # ─────────────────────────────────────────────
  - type: web
    name: citrux-hrms-chatbot
    env: python
    plan: free
    buildCommand: ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.10.12"
