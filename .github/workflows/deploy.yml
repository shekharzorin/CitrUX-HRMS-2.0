name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. Enter Project Directory
          cd ~/citrux-hrms || git clone https://github.com/shekharzorin/hrms.git ~/citrux-hrms
          cd ~/citrux-hrms
          
          # 2. Pull Latest Changes
          git pull origin main
          
          # 3. Backend Deployment
          echo "🚀 Deploying Backend..."
          cd server
          npm install
          npm run build
          # Create upload dir if not exists
          mkdir -p uploads
          # Run Database Migrations
          npx prisma migrate deploy
          
          # 4. Frontend Deployment
          echo "🚀 Deploying Frontend..."
          cd ../client
          npm install
          npm run build
          
          # 5. Restart Application
          echo "🔄 Restarting PM2..."
          cd ../server
          pm2 reload citrux-api || pm2 start dist/index.js --name "citrux-api"
          pm2 save
          
          echo "✅ Deployment Successful!"
